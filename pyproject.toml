[project]
name = "baghewala-digital-twin"
version = "0.1.0"
description = "CSS-SRP Digital Twin MVP"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.111.0",
    "uvicorn>=0.30.1",
    "pydantic>=2.7.1",
    "pint>=0.23",
    "numpy>=1.26.4",
    "scipy>=1.13.1",
    "pandas>=2.2.2",
    "scikit-learn>=1.5.0",
    "coolprop>=6.6.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.1",
    "pytest-cov>=5.0.0",
    "hypothesis>=6.103.1",
    "httpx>=0.27.0",
    "ruff>=0.4.8",
    "mypy>=1.10.0"
]

[tool.setuptools.packages.find]
include = ["backend*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
strict = true
ignore_missing_imports = true

[tool.ruff]
line-length = 88
