<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Interactive TwinLift AI Simulator</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.plot.ly/plotly-2.27.0.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <style>
        body { margin: 0; overflow: hidden; background-color: #0f172a; color: white; font-family: 'Inter', sans-serif; }
        #canvas-container { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 1; }
        
        #ui-layer { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 10; pointer-events: none; padding: 20px; box-sizing: border-box; display: flex; justify-content: space-between;}
        
        .panel { background: rgba(30, 41, 59, 0.85); border: 1px solid #334155; border-radius: 12px; padding: 20px; backdrop-filter: blur(8px); pointer-events: auto; }
        
        h3 { margin-top: 0; color: #38bdf8; border-bottom: 1px solid #334155; padding-bottom: 10px;}
        
        .control-group { margin-bottom: 20px; }
        .control-group label { display: block; font-size: 12px; color: #94a3b8; text-transform: uppercase; margin-bottom: 5px; }
        .control-group input[type=range] { width: 100%; cursor: pointer; }
        
        .metric { display: flex; justify-content: space-between; margin-bottom: 10px; font-size: 14px;}
        .metric-label { color: #cbd5e1; }
        .metric-value { font-weight: bold; font-variant-numeric: tabular-nums; }
        
        #dynacard { width: 100%; height: 200px; margin-top: 20px; background: rgba(0,0,0,0.5); border-radius: 8px; }
        
        .alert { margin-top: 15px; padding: 10px; border-radius: 8px; font-weight: bold; text-align: center; display: none;}
        .alert-danger { background: rgba(239, 68, 68, 0.2); border: 1px solid #f87171; color: #f87171; }
        .alert-success { background: rgba(34, 197, 94, 0.2); border: 1px solid #4ade80; color: #4ade80; }
    </style>
</head>
<body>
    <div id="canvas-container"></div>
    
    <div id="ui-layer">
        <div class="panel" style="width: 320px; display: flex; flex-direction: column;">
            <h3>Interactive Controls</h3>
            
            <div class="control-group">
                <label>Steam / Reservoir Temp: <span id="lbl-temp">150</span> °C</label>
                <input type="range" id="ctrl-temp" min="40" max="300" value="150">
            </div>
            
            <div class="control-group">
                <label>Pump Speed (SPM): <span id="lbl-spm">6.0</span></label>
                <input type="range" id="ctrl-spm" min="0" max="12" step="0.5" value="6.0">
            </div>
            
            <h3 style="margin-top: 20px;">Physical State</h3>
            <div class="metric"><div class="metric-label">Oil Viscosity</div><div class="metric-value" id="val-visc">100 cP</div></div>
            <div class="metric"><div class="metric-label">Rod Fillage</div><div class="metric-value" id="val-fillage">95%</div></div>
            <div class="metric"><div class="metric-label">Rod Stress</div><div class="metric-value" id="val-stress" style="color: #4ade80">Safe</div></div>
            
            <div id="alert-float" class="alert alert-danger">
                ⚠️ ROD FLOATING DETECTED<br>
                <span style="font-size: 12px; font-weight: normal;">Viscosity too high for current SPM.</span>
            </div>
        </div>
        
        <div class="panel" style="width: 350px;">
            <h3>Live Dynamometer</h3>
            <div id="dynacard"></div>
        </div>
    </div>

    <script>
        // --- 3D Scene Setup ---
        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();
        scene.fog = new THREE.FogExp2(0x0f172a, 0.015);
        
        const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(25, 10, 45);
        
        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setClearColor(0x0f172a, 1);
        container.appendChild(renderer.domElement);
        
        const controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;
        controls.target.set(0, -10, 0);

        // Lighting
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.5);
        scene.add(ambientLight);
        const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
        dirLight.position.set(10, 20, 10);
        scene.add(dirLight);

        // --- Materials & Objects ---
        const casingMat = new THREE.MeshStandardMaterial({ color: 0x94a3b8, metalness: 0.8, roughness: 0.2 });
        const rodMat = new THREE.MeshStandardMaterial({ color: 0xfacc15, metalness: 1.0, roughness: 0.1 });
        
        // Earth Cutaway (Wireframe for visibility)
        const earthMat = new THREE.MeshLambertMaterial({ color: 0x21262d, transparent: true, opacity: 0.2, wireframe: true });
        const earth = new THREE.Mesh(new THREE.BoxGeometry(30, 40, 30), earthMat);
        earth.position.y = -20;
        scene.add(earth);

        // Wellbore
        const wellbore = new THREE.Mesh(new THREE.CylinderGeometry(0.4, 0.4, 38, 16), casingMat);
        wellbore.position.y = -19;
        scene.add(wellbore);

        // Sucker Rod
        const rod = new THREE.Mesh(new THREE.CylinderGeometry(0.1, 0.1, 40, 8), rodMat);
        rod.position.y = -20;
        scene.add(rod);

        // Heated Zone (Halo)
        const heatMat = new THREE.MeshBasicMaterial({ color: 0xef4444, transparent: true, opacity: 0.6, blending: THREE.AdditiveBlending });
        const heatHalo = new THREE.Mesh(new THREE.SphereGeometry(1, 32, 32), heatMat);
        heatHalo.position.y = -35;
        scene.add(heatHalo);

        // Pumpjack
        const pumpGroup = new THREE.Group();
        scene.add(pumpGroup);
        
        const baseMesh = new THREE.Mesh(new THREE.BoxGeometry(6, 1, 2), casingMat);
        baseMesh.position.set(-2, 0.5, 0);
        pumpGroup.add(baseMesh);
        
        const sampsonPost = new THREE.Mesh(new THREE.CylinderGeometry(0.2, 0.5, 5), casingMat);
        sampsonPost.position.set(-2, 3, 0);
        pumpGroup.add(sampsonPost);

        const walkingBeam = new THREE.Mesh(new THREE.BoxGeometry(10, 0.5, 0.5), casingMat);
        walkingBeam.position.set(-2, 5.5, 0);
        pumpGroup.add(walkingBeam);
        
        const horseHead = new THREE.Mesh(new THREE.CylinderGeometry(1, 1, 0.5), casingMat);
        horseHead.rotation.x = Math.PI / 2;
        horseHead.position.set(3, 5.5, 0);
        pumpGroup.add(horseHead);

        // --- Plotly Dynacard ---
        let dynaX = [];
        let dynaY = [];
        Plotly.newPlot('dynacard', [{ x: [], y: [], mode: 'lines', line: {color: '#4ade80'} }], {
            margin: {l: 40, r: 10, t: 10, b: 20},
            paper_bgcolor: 'rgba(0,0,0,0)',
            plot_bgcolor: 'rgba(0,0,0,0)',
            xaxis: {title: 'Pos', color: '#94a3b8', showgrid: false},
            yaxis: {title: 'Load', color: '#94a3b8', showgrid: false, range: [0, 25000]}
        }, {staticPlot: true});

        // --- Interaction Logic ---
        const ctrlTemp = document.getElementById('ctrl-temp');
        const ctrlSpm = document.getElementById('ctrl-spm');
        
        function getViscosity(temp) {
            // Rough approximation: higher temp = exponentially lower viscosity
            return Math.max(10, 50000 * Math.exp(-0.03 * temp));
        }

        // --- Render Loop ---
        let time = 0;
        let lastDynUpdate = 0;
        
        function animate() {
            requestAnimationFrame(animate);
            controls.update();
            time += 0.016;
            
            // Read UI
            const temp = parseFloat(ctrlTemp.value);
            const spm = parseFloat(ctrlSpm.value);
            
            // Calculate Physical State
            const visc = getViscosity(temp);
            
            // Rod Floating Check (if viscosity is high and pump is fast)
            // Heuristic: If spm * visc > 15000, we start floating
            const floatRiskFactor = (spm * visc) / 15000;
            const isFloating = floatRiskFactor > 1.0 && spm > 0;
            
            // Update labels
            document.getElementById('lbl-temp').innerText = temp.toFixed(0);
            document.getElementById('lbl-spm').innerText = spm.toFixed(1);
            document.getElementById('val-visc').innerText = Math.round(visc).toLocaleString() + " cP";
            
            // Update Visuals
            // Heat Halo scales with temperature
            const scale = 1 + (temp / 100);
            heatHalo.scale.set(scale, scale, scale);
            // Color shifts from orange/yellow to deep red
            const heatColor = new THREE.Color();
            heatColor.setHSL(0.1 - (temp/300)*0.1, 1, 0.5);
            heatHalo.material.color = heatColor;
            heatHalo.material.opacity = (temp/300) * 0.8;
            
            // Pumpjack Motion
            if (spm > 0) {
                const freq = spm / 60; // Hz
                const rodPos = Math.sin(time * Math.PI * 2 * freq);
                
                // Animate Beam
                walkingBeam.rotation.z = rodPos * 0.2;
                horseHead.position.y = 5.5 + Math.sin(walkingBeam.rotation.z)*5;
                
                // Animate Rod
                let rodStroke = rodPos * 1.5;
                if (isFloating && rodPos < 0) {
                     rodStroke = Math.max(rodStroke, -0.2); // Rod gets stuck falling
                }
                rod.position.y = -20 + rodStroke;
                
                // Fillage and Stress
                let fillage = 100 - (spm * 2);
                if (isFloating) fillage -= 40;
                document.getElementById('val-fillage').innerText = Math.max(0, Math.round(fillage)) + "%";
                
                let stressLevel = "Safe";
                let stressColor = "#4ade80";
                if (isFloating) {
                    stressLevel = "CRITICAL";
                    stressColor = "#f87171";
                } else if (spm > 9) {
                    stressLevel = "Warning";
                    stressColor = "#fbbf24";
                }
                document.getElementById('val-stress').innerText = stressLevel;
                document.getElementById('val-stress').style.color = stressColor;
                
                // Live Dynacard
                if (time - lastDynUpdate > 0.05) { // 20fps update for graph
                    lastDynUpdate = time;
                    if (dynaX.length > 50) { dynaX.shift(); dynaY.shift(); }
                    
                    let pos = (rodPos + 1) / 2;
                    let load = rodPos > 0 ? 15000 : 7000; // Base loads
                    
                    if (isFloating && rodPos < -0.2) load = 1000; // Drops to zero
                    
                    load += (Math.random() - 0.5) * 500; // Noise
                    
                    dynaX.push(pos);
                    dynaY.push(load);
                    Plotly.update('dynacard', {x: [dynaX], y: [dynaY]}, {'line.color': isFloating ? '#ef4444' : '#4ade80'});
                }
            } else {
                // Pump stopped
                document.getElementById('val-fillage').innerText = "0%";
                document.getElementById('val-stress').innerText = "None";
                document.getElementById('val-stress').style.color = "#94a3b8";
            }
            
            // Alert visibility
            document.getElementById('alert-float').style.display = isFloating ? 'block' : 'none';
            if (isFloating) {
                wellbore.material.color.setHex(0xf87171);
            } else {
                wellbore.material.color.setHex(0x94a3b8);
            }
            
            renderer.render(scene, camera);
        }
        
        animate();
        
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
