<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Digital Twin Vision</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <nav id="navbar">
        <div class="logo">TwinLift AI</div>
        <div class="links">
            <a href="#">Overview</a>
            <a href="#">Technology</a>
        </div>
    </nav>

    <div class="scroll-container">
        <!-- Sticky container holds the canvas full-screen -->
        <div class="sticky-container">
            <canvas id="video-canvas"></canvas>
            
            <div class="overlay-text step-1">
                <h2>Predict.</h2>
                <p>Advanced physics + AI forecasting.</p>
            </div>
            <div class="overlay-text step-2">
                <h2>Optimize.</h2>
                <p>Maximize production, minimize energy.</p>
            </div>
            <div class="overlay-text step-3">
                <h2>Protect.</h2>
                <p>Detect failures before they happen.</p>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
